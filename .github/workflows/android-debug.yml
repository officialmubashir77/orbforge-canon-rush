
name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout game source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "ndk;28.1.13356709" "cmake;3.10.2.4988404"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Godot 4.7.2
        run: bash tools/install_godot.sh

      - name: Initialize Godot
        run: godot --headless --editor --path . --quit

      - name: Configure Android SDK paths
        run: python3 tools/configure_android_editor.py

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/orbforge-debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/orbforge-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Validate project
        run: python3 tools/validate_project.py

      - name: Import Godot resources
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error|Parser Error|ERROR: Failed loading' "$RUNNER_TEMP/godot-import.log"; then exit 1; fi

      - name: Run gameplay tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee "$RUNNER_TEMP/godot-tests.log"
          grep -q 'ALL ORBFORGE TESTS PASSED' "$RUNNER_TEMP/godot-tests.log"

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          mkdir -p builds
          godot --headless --path . --export-debug "Android" builds/orbforge-debug.apk 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s builds/orbforge-debug.apk
          unzip -t builds/orbforge-debug.apk

      - name: Verify APK package
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging builds/orbforge-debug.apk | tee "$RUNNER_TEMP/apk-metadata.txt"
          grep -q "package: name='com.yourstudio.orbforgecannon'" "$RUNNER_TEMP/apk-metadata.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbForge-Android-Debug-APK
          path: builds/orbforge-debug.apk
          if-no-files-found: error
          retention-days: 14
